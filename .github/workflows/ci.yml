name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_version.py
      - run: python -m py_compile addon/blender_multiplayer/__init__.py addon/blender_multiplayer/session.py addon/blender_multiplayer/control.py
      - run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check desktop/ui/app.js
      - run: node --check desktop/ui/layout.js
