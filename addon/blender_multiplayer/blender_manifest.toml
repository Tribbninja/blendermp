schema_version = "1.0.0"
id = "blender_multiplayer"
version = "0.9.9"
name = "Blendermp"
tagline = "Low-latency collaborative Blender sessions over TLS"
maintainer = "Blendermp"
type = "add-on"
tags = ["System", "Pipeline", "User Interface"]
blender_version_min = "4.2.0"
license = ["SPDX:MIT"]
[permissions]
network = "Connect to session hosts and relays"
files = "Read and write the local session control files"
clipboard = "Copy room codes and diagnostics"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  ".pytest_cache/",
  "tests/",
]
